name: Build & Deploy FrontEnd to EC2

on:
  push:
    branches: [ "main" ]
    paths:
      - 'FrontEnd/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug folder tree
        run: |
          echo "Current dir:"
          pwd
          echo "Listing:"
          ls -la
          echo "FrontEnd folder content:"
          ls -la FrontEnd

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: FrontEnd/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: FrontEnd

      - name: Build project
        run: npm run build
        working-directory: FrontEnd

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: FrontEnd/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: frontendDementaiAi

    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${EC2_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

      - name: Sync dist to EC2
        run: |
          rsync -avz -e "ssh -i ~/.ssh/id_ed25519" --delete dist/ $EC2_USER@$EC2_HOST:${DEPLOY_PATH:-/var/www/app}/
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: Restart nginx
        run: |
          ssh -i ~/.ssh/id_ed25519 $EC2_USER@$EC2_HOST "sudo systemctl restart nginx"
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}